name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 30 \
            https://nazorat360.onrender.com/health
          echo "Bot pinged at $(date)"
